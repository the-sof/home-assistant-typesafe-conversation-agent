name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hassfest:
    # Home Assistant's own validator: checks manifest.json against the current
    # schema, and that strings.json and the translations agree with it.
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # The same validation the HACS default store runs on submission. A failure
    # fails this workflow; wait for it to pass on main before releasing.
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
