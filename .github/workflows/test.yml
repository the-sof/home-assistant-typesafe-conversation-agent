name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both ends of the range declared in the README. The floor job is the
          # point of the matrix: a supported version nobody runs the tests
          # against is a guess, not a claim.
          #
          # The labels are fixed on purpose: they are the required status
          # checks on main, so a version in the name would block every merge
          # after a Home Assistant bump until the branch settings were edited.
          - harness: "0.13.329"   # homeassistant 2026.5.0 - the declared floor
            label: "HA floor"
            version: "2026.5.0"
          - harness: "0.13.367"   # homeassistant 2026.9.4 - current
            label: "HA current"
            version: "2026.9.4"

    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install the harness (Home Assistant ${{ matrix.version }})
        run: |
          python -m pip install --upgrade pip
          pip install "pytest-homeassistant-custom-component==${{ matrix.harness }}" syrupy

      - name: Install the conversation component's own requirements
        # Not pulled in by the harness, and the pins move with the core version,
        # so read them off the homeassistant that was just installed rather than
        # duplicating them per matrix entry.
        run: |
          pip install $(python -c "
          import json, pathlib, homeassistant
          root = pathlib.Path(homeassistant.__file__).parent / 'components'
          reqs = set()
          for component in ('conversation', 'intent', 'homeassistant'):
              manifest = root / component / 'manifest.json'
              reqs.update(json.loads(manifest.read_text()).get('requirements') or [])
          print(' '.join(sorted(reqs)))
          ")

      - name: Show what is under test
        run: python -c "import homeassistant.const as c; print('homeassistant', c.__version__)"

      - run: python -m pytest
